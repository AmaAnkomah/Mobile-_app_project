<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ghana Police Service — System Portal</title>
  <meta name="description" content="Ghana Police Service official digital systems portal — access all police ICT platforms from one hub." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --gold: #D4AF37; --gold-light: #F5D479; --gold-dark: #A0841E;
      --navy: #0A1628; --navy-mid: #0D1F3C; --navy-light: #142545;
      --accent: #1E3A6E; --white: #FFFFFF; --off-white: #E8DEBA;
      --node-size: 90px; --center-size: 130px;
    }
    html, body { width: 100%; height: 100%; overflow: hidden; }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--navy);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      min-height: 100vh; position: relative;
    }
    .bg-layer {
      position: fixed; inset: 0; z-index: 0;
      background:
        radial-gradient(ellipse 80% 60% at 50% -10%, rgba(212,175,55,.18) 0%, transparent 70%),
        radial-gradient(ellipse 60% 50% at 90% 80%, rgba(30,58,110,.45) 0%, transparent 70%),
        linear-gradient(165deg, #0A1628 0%, #0D1F3C 50%, #091425 100%);
    }
    .particles { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
    .particle {
      position: absolute; border-radius: 50%; background: var(--gold);
      opacity: 0; animation: float-up linear infinite;
    }
    @keyframes float-up {
      0% { transform: translateY(100vh) scale(0); opacity: 0; }
      10% { opacity: .35; } 90% { opacity: .15; }
      100% { transform: translateY(-10vh) scale(1.5); opacity: 0; }
    }
    .grid-overlay {
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background-image:
        linear-gradient(rgba(212,175,55,.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(212,175,55,.04) 1px, transparent 1px);
      background-size: 60px 60px;
    }
    .header { position: relative; z-index: 10; text-align: center; margin-bottom: 18px; user-select: none; }
    .header-inner { display: flex; align-items: center; gap: 20px; justify-content: center; }
    .logo-img {
      width: 72px; height: 72px; object-fit: contain;
      filter: drop-shadow(0 0 12px rgba(212,175,55,.6));
      animation: pulse-logo 3s ease-in-out infinite;
    }
    @keyframes pulse-logo {
      0%, 100% { filter: drop-shadow(0 0 10px rgba(212,175,55,.5)); }
      50% { filter: drop-shadow(0 0 22px rgba(212,175,55,.9)); }
    }
    .header-text h1 {
      font-family: 'Cinzel', serif; font-size: 1.6rem;
      letter-spacing: .12em; color: var(--gold-light);
      text-shadow: 0 0 30px rgba(212,175,55,.4);
    }
    .header-text p {
      font-size: .72rem; letter-spacing: .3em; color: var(--off-white);
      opacity: .7; margin-top: 2px; text-transform: uppercase;
    }
    .gold-divider {
      width: 340px; height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
      margin: 8px auto 0; opacity: .6;
    }
    .diagram-wrapper { position: relative; z-index: 10; }
    .connector-svg {
      position: absolute; top: 0; left: 0;
      width: 100%; height: 100%; pointer-events: none; overflow: visible;
    }
    .connector-line {
      stroke: url(#lineGradient); stroke-width: 2.5;
      stroke-dasharray: 6 4; opacity: .55;
      animation: dash-flow 3s linear infinite;
      transition: stroke .3s, opacity .3s, stroke-width .3s;
    }
    .connector-line.lit {
      stroke: var(--gold-light); opacity: 1; stroke-width: 3.5;
      filter: drop-shadow(0 0 6px var(--gold));
    }
    @keyframes dash-flow { to { stroke-dashoffset: -28; } }
    .diagram { position: relative; width: 780px; height: 640px; }
    .orbit-ring {
      position: absolute; border-radius: 50%;
      border: 1px solid rgba(212,175,55,.25);
      left: 50%; top: 50%; transform: translate(-50%,-50%);
      pointer-events: none;
    }
    .orbit-ring.r1 { width: 260px; height: 260px; animation: spin-ring 25s linear infinite; }
    .orbit-ring.r2 { width: 320px; height: 320px; animation: spin-ring 40s linear infinite reverse; border-style: dashed; opacity: .4; }
    @keyframes spin-ring { to { transform: translate(-50%,-50%) rotate(360deg); } }
    .orbit-ring.r1::before, .orbit-ring.r1::after {
      content: ''; position: absolute;
      top: -4px; left: 50%; transform: translateX(-50%);
      width: 8px; height: 8px; background: var(--gold);
      border-radius: 50%; box-shadow: 0 0 8px var(--gold);
    }
    .orbit-ring.r1::after { top: auto; bottom: -4px; }
    .center-node {
      position: absolute; left: 50%; top: 50%;
      transform: translate(-50%,-50%);
      width: var(--center-size); height: var(--center-size);
      cursor: pointer; z-index: 5;
    }
    .center-node .shield {
      width: 100%; height: 100%;
      background: linear-gradient(145deg, var(--navy-light) 0%, var(--accent) 100%);
      border: 2.5px solid var(--gold); border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 0 0 6px rgba(212,175,55,.12), 0 0 30px rgba(212,175,55,.3), inset 0 0 30px rgba(212,175,55,.05);
      transition: all .4s ease; position: relative; overflow: hidden;
    }
    .center-node .shield::before {
      content: ''; position: absolute; inset: 0;
      background: conic-gradient(from 0deg, transparent 0%, rgba(212,175,55,.08) 25%, transparent 50%, rgba(212,175,55,.08) 75%, transparent 100%);
      animation: spin-ring 8s linear infinite;
    }
    .center-logo {
      width: 72px; height: 72px; object-fit: contain;
      position: relative; z-index: 1;
      filter: drop-shadow(0 0 8px rgba(212,175,55,.6));
      transition: transform .4s;
    }
    .center-node:hover .shield {
      box-shadow: 0 0 0 8px rgba(212,175,55,.2), 0 0 50px rgba(212,175,55,.6), inset 0 0 40px rgba(212,175,55,.1);
      border-color: var(--gold-light);
    }
    .center-node:hover .center-logo { transform: scale(1.1); }
    .center-label {
      position: absolute; bottom: -36px; left: 50%; transform: translateX(-50%);
      white-space: nowrap; font-family: 'Cinzel', serif;
      font-size: .7rem; letter-spacing: .18em;
      color: var(--gold); text-shadow: 0 0 10px rgba(212,175,55,.5);
    }
    .node-link {
      position: absolute; text-decoration: none;
      display: flex; flex-direction: column;
      align-items: center; gap: 8px; z-index: 6;
    }
    .pos-top    { left: 50%; top: 28px; transform: translateX(-50%); }
    .pos-bottom { left: 50%; bottom: 28px; transform: translateX(-50%); }
    .pos-lt     { left: 28px; top: 175px; }
    .pos-lb     { left: 28px; bottom: 175px; }
    .pos-rt     { right: 28px; top: 175px; }
    .pos-rb     { right: 28px; bottom: 175px; }
    .node-card {
      width: var(--node-size); height: var(--node-size);
      background: linear-gradient(145deg, rgba(13,31,60,.9), rgba(20,37,69,.95));
      border: 2px solid rgba(212,175,55,.45); border-radius: 16px;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 6px;
      cursor: pointer; transition: all .35s ease;
      position: relative; overflow: hidden;
      box-shadow: 0 4px 20px rgba(0,0,0,.4), inset 0 1px 0 rgba(212,175,55,.15);
      backdrop-filter: blur(8px);
    }
    .node-card::before {
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(120deg, transparent 30%, rgba(212,175,55,.08) 50%, transparent 70%);
      transform: translateX(-100%); transition: transform .5s ease;
    }
    .node-link:hover .node-card::before { transform: translateX(100%); }
    .node-card::after {
      content: ''; position: absolute; top: 0; right: 0;
      border-style: solid; border-width: 0 22px 22px 0;
      border-color: transparent rgba(212,175,55,.35) transparent transparent;
      transition: border-color .3s;
    }
    .node-link:hover .node-card::after { border-color: transparent var(--gold) transparent transparent; }
    .node-link:hover .node-card {
      border-color: var(--gold); transform: translateY(-6px) scale(1.06);
      box-shadow: 0 12px 40px rgba(0,0,0,.5), 0 0 30px rgba(212,175,55,.35), inset 0 1px 0 rgba(212,175,55,.3);
    }
    .node-icon { font-size: 28px; line-height: 1; transition: transform .35s; }
    .node-link:hover .node-icon { transform: scale(1.15); }
    .node-title { font-size: .58rem; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--gold); text-align: center; line-height: 1.2; }
    .node-label { font-size: .62rem; color: var(--off-white); opacity: .75; text-align: center; max-width: 110px; line-height: 1.3; transition: opacity .3s; font-weight: 300; }
    .node-link:hover .node-label { opacity: 1; }
    .footer { position: relative; z-index: 10; margin-top: 14px; text-align: center; color: rgba(232,222,186,.45); font-size: .65rem; letter-spacing: .15em; text-transform: uppercase; }
    .tooltip {
      position: fixed;
      background: rgba(10,22,40,.95); border: 1px solid var(--gold);
      border-radius: 8px; padding: 8px 14px; font-size: .7rem;
      color: var(--off-white); pointer-events: none;
      opacity: 0; transform: translateY(4px);
      transition: opacity .2s, transform .2s; z-index: 999;
      white-space: nowrap; box-shadow: 0 4px 20px rgba(0,0,0,.5);
    }
    .tooltip.show { opacity: 1; transform: translateY(0); }
    .tooltip span { color: var(--gold); font-weight: 600; }
    .pulse-dot { position: absolute; width: 10px; height: 10px; border-radius: 50%; background: var(--gold); top: 6px; right: 6px; }
    .pulse-dot::after {
      content: ''; position: absolute; inset: -4px; border-radius: 50%;
      background: var(--gold); opacity: 0; animation: pulse-ring 2s ease-out infinite;
    }
    @keyframes pulse-ring {
      0% { transform: scale(.8); opacity: .8; }
      100% { transform: scale(2.2); opacity: 0; }
    }
    .shield-svg { width: 72px; height: 72px; position: relative; z-index: 1; }
  </style>
</head>
<body>
  <div class="bg-layer"></div>
  <div class="grid-overlay"></div>
  <div class="particles" id="particles"></div>
  <div class="tooltip" id="tooltip"><span></span></div>

  <header class="header" role="banner">
    <div class="header-inner">
      <!-- Logo attempt 1: official site -->
      <img src="https://upload.wikimedia.org/wikipedia/en/thumb/3/3c/Ghana_Police_Service_logo.png/200px-Ghana_Police_Service_logo.png"
           alt="Ghana Police Service Logo" class="logo-img" id="logo1"
           onerror="this.style.display='none'; showFallback('fb1');" />
      <svg id="fb1" style="display:none;" class="logo-img shield-svg" viewBox="0 0 80 90" xmlns="http://www.w3.org/2000/svg">
        <defs><linearGradient id="sg1" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#1E3A6E"/><stop offset="100%" stop-color="#0A1628"/></linearGradient></defs>
        <path d="M40 2 L78 18 L78 50 Q78 76 40 88 Q2 76 2 50 L2 18 Z" fill="url(#sg1)" stroke="#D4AF37" stroke-width="3"/>
        <polygon points="40,22 44,34 57,34 47,42 51,55 40,47 29,55 33,42 23,34 36,34" fill="#D4AF37"/>
        <text x="40" y="74" text-anchor="middle" fill="#D4AF37" font-size="5.5" font-family="serif" letter-spacing="1">POLICE SERVICE</text>
      </svg>
      <div class="header-text">
        <h1>GHANA POLICE SERVICE</h1>
        <p>Integrated Digital Systems Portal</p>
      </div>
      <img src="https://upload.wikimedia.org/wikipedia/en/thumb/3/3c/Ghana_Police_Service_logo.png/200px-Ghana_Police_Service_logo.png"
           alt="" class="logo-img" aria-hidden="true" onerror="this.style.display='none';" />
    </div>
    <div class="gold-divider"></div>
  </header>

  <main class="diagram-wrapper" role="main" aria-label="Police Systems Network">
    <div class="diagram" id="diagram">
      <svg class="connector-svg" id="connectorSvg" aria-hidden="true"></svg>
      <div class="orbit-ring r1" aria-hidden="true"></div>
      <div class="orbit-ring r2" aria-hidden="true"></div>

      <!-- CENTER -->
      <div class="center-node" id="center" title="GPS Portal Hub" role="img" aria-label="Ghana Police Service Portal Hub">
        <div class="shield">
          <img src="https://upload.wikimedia.org/wikipedia/en/thumb/3/3c/Ghana_Police_Service_logo.png/200px-Ghana_Police_Service_logo.png"
               alt="Ghana Police Service Emblem" class="center-logo"
               onerror="this.outerHTML=`<svg class='center-logo shield-svg' viewBox='0 0 80 90' xmlns='http://www.w3.org/2000/svg'><defs><linearGradient id='csg' x1='0%25' y1='0%25' x2='100%25' y2='100%25'><stop offset='0%25' stop-color='%231E3A6E'/><stop offset='100%25' stop-color='%230A1628'/></linearGradient></defs><path d='M40 2 L78 18 L78 50 Q78 76 40 88 Q2 76 2 50 L2 18 Z' fill='url(%23csg)' stroke='%23D4AF37' stroke-width='3'/><polygon points='40,22 44,34 57,34 47,42 51,55 40,47 29,55 33,42 23,34 36,34' fill='%23D4AF37'/></svg>`;" />
        </div>
        <div class="center-label">GPS PORTAL HUB</div>
      </div>

      <!-- TOP: EHR -->
      <a href="https://ehr.police.gov.gh" target="_blank" rel="noopener noreferrer"
         class="node-link pos-top" id="node-ehr" data-tip="Employee HR Management" aria-label="Employee HR System">
        <div class="node-card">
          <div class="pulse-dot" aria-hidden="true"></div>
          <div class="node-icon" aria-hidden="true">
            <svg width="30" height="30" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="4" fill="#D4AF37"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7" stroke="#D4AF37" stroke-width="2" stroke-linecap="round"/></svg>
          </div>
          <div class="node-title">EHR</div>
        </div>
        <div class="node-label">Human Resources</div>
      </a>

      <!-- BOTTOM: PWS -->
      <a href="https://pws.police.gov.gh" target="_blank" rel="noopener noreferrer"
         class="node-link pos-bottom" id="node-pws" data-tip="Police Web Service Platform" aria-label="Police Web Service">
        <div class="node-label">Web Services</div>
        <div class="node-card">
          <div class="pulse-dot" aria-hidden="true"></div>
          <div class="node-icon" aria-hidden="true">
            <svg width="30" height="30" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="#D4AF37" stroke-width="2"/><path d="M12 3c-3 3-5 5.5-5 9s2 6 5 9" stroke="#D4AF37" stroke-width="1.5" stroke-linecap="round"/><path d="M12 3c3 3 5 5.5 5 9s-2 6-5 9" stroke="#D4AF37" stroke-width="1.5" stroke-linecap="round"/><line x1="3" y1="12" x2="21" y2="12" stroke="#D4AF37" stroke-width="1.5"/></svg>
          </div>
          <div class="node-title">PWS</div>
        </div>
      </a>

      <!-- LEFT-TOP: ICT -->
      <a href="https://icthelpdesk.police.gov.gh" target="_blank" rel="noopener noreferrer"
         class="node-link pos-lt" id="node-ict" data-tip="ICT Support and Helpdesk" aria-label="ICT Helpdesk">
        <div class="node-card">
          <div class="pulse-dot" aria-hidden="true"></div>
          <div class="node-icon" aria-hidden="true">
            <svg width="30" height="30" viewBox="0 0 24 24" fill="none"><rect x="2" y="3" width="20" height="14" rx="2" stroke="#D4AF37" stroke-width="2"/><path d="M8 21h8M12 17v4" stroke="#D4AF37" stroke-width="2" stroke-linecap="round"/><path d="M9 10h1l1-3 2 6 1-3h1" stroke="#D4AF37" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </div>
          <div class="node-title">ICT</div>
        </div>
        <div class="node-label">Helpdesk</div>
      </a>

      <!-- LEFT-BOTTOM: FENS -->
      <a href="https://fens.police.gov.gh" target="_blank" rel="noopener noreferrer"
         class="node-link pos-lb" id="node-fens" data-tip="Financial and Enterprise System" aria-label="Financial Enterprise System">
        <div class="node-card">
          <div class="pulse-dot" aria-hidden="true"></div>
          <div class="node-icon" aria-hidden="true">
            <svg width="30" height="30" viewBox="0 0 24 24" fill="none"><rect x="2" y="7" width="20" height="14" rx="2" stroke="#D4AF37" stroke-width="2"/><path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2" stroke="#D4AF37" stroke-width="2"/><circle cx="12" cy="14" r="2" fill="#D4AF37"/></svg>
          </div>
          <div class="node-title">FENS</div>
        </div>
        <div class="node-label">Finance</div>
      </a>

      <!-- RIGHT-TOP: PWSO -->
      <a href="https://pwso.police.gov.gh" target="_blank" rel="noopener noreferrer"
         class="node-link pos-rt" id="node-pwso" data-tip="Police Welfare and Service Orders" aria-label="Police Welfare and Service Orders">
        <div class="node-card">
          <div class="pulse-dot" aria-hidden="true"></div>
          <div class="node-icon" aria-hidden="true">
            <svg width="30" height="30" viewBox="0 0 24 24" fill="none"><path d="M12 2L3 7l9 5 9-5-9-5z" stroke="#D4AF37" stroke-width="2" stroke-linejoin="round"/><path d="M3 12l9 5 9-5" stroke="#D4AF37" stroke-width="2" stroke-linejoin="round"/><path d="M3 17l9 5 9-5" stroke="#D4AF37" stroke-width="2" stroke-linejoin="round"/></svg>
          </div>
          <div class="node-title">PWSO</div>
        </div>
        <div class="node-label">Welfare Orders</div>
      </a>

      <!-- RIGHT-BOTTOM: ARMS -->
      <a href="https://arms.police.gov.gh" target="_blank" rel="noopener noreferrer"
         class="node-link pos-rb" id="node-arms" data-tip="Armory and Resource Management" aria-label="Arms Management System">
        <div class="node-card">
          <div class="pulse-dot" aria-hidden="true"></div>
          <div class="node-icon" aria-hidden="true">
            <svg width="30" height="30" viewBox="0 0 24 24" fill="none"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" stroke="#D4AF37" stroke-width="2" stroke-linejoin="round"/><path d="M9 12l2 2 4-4" stroke="#D4AF37" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </div>
          <div class="node-title">ARMS</div>
        </div>
        <div class="node-label">Armory Mgmt</div>
      </a>

    </div>
  </main>

  <footer class="footer" role="contentinfo">
    <p>&copy; <span id="yr"></span> Ghana Police Service &mdash; ICT Directorate &nbsp;|&nbsp; With Us You Are Safe</p>
  </footer>

  <script>
    document.getElementById('yr').textContent = new Date().getFullYear();
    function showFallback(id) { var el = document.getElementById(id); if(el) el.style.display = 'block'; }
    (function spawnParticles() {
      var container = document.getElementById('particles');
      for (var i = 0; i < 30; i++) {
        var p = document.createElement('div');
        p.className = 'particle';
        var size = Math.random() * 4 + 2;
        p.style.cssText = 'width:'+size+'px;height:'+size+'px;left:'+Math.floor(Math.random()*100)+'%;animation-duration:'+(Math.random()*18+10)+'s;animation-delay:'+(Math.random()*12)+'s;';
        container.appendChild(p);
      }
    })();
    function drawConnectors() {
      var svg = document.getElementById('connectorSvg');
      var diag = document.getElementById('diagram');
      var center = document.getElementById('center');
      var nodeIds = ['node-ehr','node-pws','node-ict','node-fens','node-pwso','node-arms'];
      svg.innerHTML = '<defs><linearGradient id="lineGradient" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#D4AF37" stop-opacity=".3"/><stop offset="50%" stop-color="#F5D479" stop-opacity=".8"/><stop offset="100%" stop-color="#D4AF37" stop-opacity=".3"/></linearGradient></defs>';
      var diagRect = diag.getBoundingClientRect();
      var centerRect = center.getBoundingClientRect();
      var cx = centerRect.left - diagRect.left + centerRect.width / 2;
      var cy = centerRect.top - diagRect.top + centerRect.height / 2;
      nodeIds.forEach(function(id, idx) {
        var el = document.getElementById(id);
        var card = el ? el.querySelector('.node-card') : null;
        if (!el || !card) return;
        var rect = card.getBoundingClientRect();
        var nx = rect.left - diagRect.left + rect.width / 2;
        var ny = rect.top - diagRect.top + rect.height / 2;
        var line = document.createElementNS('http://www.w3.org/2000/svg','line');
        line.setAttribute('x1', cx); line.setAttribute('y1', cy);
        line.setAttribute('x2', nx); line.setAttribute('y2', ny);
        line.setAttribute('class','connector-line');
        line.setAttribute('data-node', id);
        line.style.animationDelay = (idx * .5) + 's';
        svg.appendChild(line);
        el.addEventListener('mouseenter', function() {
          document.querySelectorAll('.connector-line[data-node="'+id+'"]').forEach(function(l){ l.classList.add('lit'); });
        });
        el.addEventListener('mouseleave', function() {
          document.querySelectorAll('.connector-line[data-node="'+id+'"]').forEach(function(l){ l.classList.remove('lit'); });
        });
      });
    }
    var tooltip = document.getElementById('tooltip');
    document.querySelectorAll('[data-tip]').forEach(function(el) {
      el.addEventListener('mouseenter', function() {
        tooltip.querySelector('span').textContent = el.dataset.tip;
        tooltip.classList.add('show');
      });
      el.addEventListener('mousemove', function(e) {
        tooltip.style.left = (e.clientX + 16) + 'px';
        tooltip.style.top = (e.clientY - 10) + 'px';
      });
      el.addEventListener('mouseleave', function() { tooltip.classList.remove('show'); });
    });
    window.addEventListener('load', drawConnectors);
    window.addEventListener('resize', drawConnectors);
  </script>
</body>
</html>
